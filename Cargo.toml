[package]
name = "sqlitediff"
version = "0.1.0"
edition = "2021"
description = "Diffs two SQLite database files directly and reports schema differences"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/sqlitediff"
readme = "README.md"
keywords = ["sqlite", "diff", "schema", "cli"]
categories = ["command-line-utilities"]

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
similar = { version = "2", features = ["inline"] }
colored = "2"
